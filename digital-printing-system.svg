<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title description">
  <title id="title">Digital Printing System</title>
  <desc id="description">An infographic showing artwork flowing through prepress and a RIP, into a digital printer, onto print media, and through finishing to the final product.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="1" stop-color="#e8f3f5"/>
    </linearGradient>
    <linearGradient id="printer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243b53"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6 1 11Z" fill="#55718b"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #18324b; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 3px; fill: #168a9b; }
      .title { font-size: 42px; font-weight: 750; letter-spacing: 1px; }
      .subtitle { font-size: 18px; fill: #60758a; }
      .card { fill: #fff; stroke: #d7e3ed; stroke-width: 2; }
      .step { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #168a9b; }
      .heading { font-size: 22px; font-weight: 700; }
      .body { font-size: 15px; fill: #60758a; }
      .small { font-size: 13px; fill: #60758a; }
      .icon-stroke { fill: none; stroke: #168a9b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#background)"/>
  <circle cx="1280" cy="105" r="115" fill="#d9eef0" opacity=".65"/>
  <circle cx="80" cy="815" r="150" fill="#e1eafa" opacity=".7"/>

  <text x="100" y="82" class="eyebrow">HOW A PRINT JOB BECOMES A PRODUCT</text>
  <text x="100" y="137" class="title">DIGITAL PRINTING SYSTEM</text>
  <text x="100" y="174" class="subtitle">A connected workflow: prepare the file, process it, print, then finish.</text>

  <rect x="100" y="215" width="1200" height="475" rx="28" fill="#ffffff" opacity=".62"/>

  <path d="M330 432H390" stroke="#55718b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M610 432H670" stroke="#55718b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M930 432H990" stroke="#55718b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1120 550V610H220V550" fill="none" stroke="#9bb0c2" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <rect x="535" y="592" width="272" height="32" rx="16" fill="#edf4f8"/>
  <text x="671" y="613" text-anchor="middle" class="small">CHECK QUALITY • ADJUST • REPRINT IF NEEDED</text>

  <g>
    <rect x="130" y="300" width="200" height="250" rx="18" class="card"/>
    <text x="155" y="336" class="step">01  CREATE</text>
    <rect x="182" y="365" width="92" height="104" rx="8" fill="#eaf4f5" stroke="#c7e4e6" stroke-width="2"/>
    <path d="M201 389h54M201 405h54M201 421h38" class="icon-stroke"/>
    <path d="M247 365v22h27" fill="none" stroke="#168a9b" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="205" cy="449" r="7" fill="#e54f64"/>
    <circle cx="228" cy="449" r="7" fill="#f3bd46"/>
    <circle cx="251" cy="449" r="7" fill="#35a785"/>
    <text x="230" y="499" text-anchor="middle" class="heading">Artwork</text>
    <text x="230" y="525" text-anchor="middle" class="body">PDF • layout • images</text>
  </g>

  <g>
    <rect x="390" y="300" width="220" height="250" rx="18" class="card"/>
    <text x="415" y="336" class="step">02  PREPARE</text>
    <rect x="445" y="371" width="110" height="70" rx="9" fill="#eaf4f5" stroke="#c7e4e6" stroke-width="2"/>
    <path d="M460 392h80M460 406h58M460 420h72" class="icon-stroke"/>
    <path d="M500 441v15M477 456h46" class="icon-stroke"/>
    <circle cx="470" cy="478" r="8" fill="#24a9b5"/>
    <circle cx="500" cy="478" r="8" fill="#e54f64"/>
    <circle cx="530" cy="478" r="8" fill="#f3bd46"/>
    <text x="500" y="510" text-anchor="middle" class="heading">Prepress + RIP</text>
    <text x="500" y="533" text-anchor="middle" class="body">Color • layout • raster data</text>
  </g>

  <g>
    <rect x="670" y="275" width="260" height="300" rx="22" fill="url(#printer)"/>
    <text x="698" y="315" class="step" fill="#67d1d1">03  PRINT</text>
    <rect x="710" y="345" width="180" height="118" rx="12" fill="#314f69"/>
    <rect x="728" y="362" width="145" height="48" rx="6" fill="#d9e8ef"/>
    <path d="M739 378h123M739 390h90" stroke="#9ab4c5" stroke-width="4" stroke-linecap="round"/>
    <rect x="733" y="420" width="137" height="13" rx="6" fill="#172f45"/>
    <path d="M745 433v29h115v-29" fill="#fff" stroke="#b6c8d5" stroke-width="2"/>
    <path d="M757 443h92" stroke="#24a9b5" stroke-width="5"/>
    <path d="M757 451h68" stroke="#e54f64" stroke-width="5"/>
    <circle cx="860" cy="480" r="5" fill="#67d1d1"/>
    <text x="800" y="518" text-anchor="middle" class="heading" fill="#ffffff">Digital printer</text>
    <text x="800" y="545" text-anchor="middle" font-size="14" fill="#cfdae3">Inkjet or toner engine</text>
  </g>

  <g>
    <rect x="990" y="300" width="250" height="250" rx="18" class="card"/>
    <text x="1015" y="336" class="step">04  MATERIAL</text>
    <path d="M1042 385h118l35 18v75h-153z" fill="#fff" stroke="#168a9b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M1160 385v20h35M1057 421h110M1057 437h82" class="icon-stroke"/>
    <path d="M1042 478l21-13 22 13 22-13 22 13 22-13 22 13" fill="none" stroke="#e54f64" stroke-width="3"/>
    <text x="1115" y="510" text-anchor="middle" class="heading">Print media</text>
    <text x="1115" y="533" text-anchor="middle" class="body">Paper • labels • film</text>
  </g>

  <g>
    <rect x="1020" y="714" width="220" height="105" rx="18" class="card"/>
    <text x="1045" y="748" class="step">05  FINISH</text>
    <path d="M1050 770h50v25h-50zM1111 770h24v25h-24zM1146 770h64" fill="none" stroke="#168a9b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M1057 782h35M1154 780l10 10 18-21" fill="none" stroke="#e54f64" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1130" y="808" text-anchor="middle" class="small">Cut • fold • laminate • bind</text>
  </g>

  <g>
    <rect x="140" y="714" width="260" height="105" rx="18" class="card"/>
    <text x="165" y="748" class="step">06  DELIVER</text>
    <path d="M175 771h45l13 12h92v22H175z" fill="#eaf4f5" stroke="#168a9b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M243 783h72" stroke="#168a9b" stroke-width="3"/>
    <text x="270" y="808" text-anchor="middle" class="small">Inspect • package • deliver</text>
  </g>

  <path d="M1115 550v164" stroke="#55718b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1020 766h-620" stroke="#55718b" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="450" y="835" width="500" height="42" rx="21" fill="#18324b"/>
  <circle cx="485" cy="856" r="7" fill="#35c2b5"/>
  <text x="510" y="862" font-size="15" font-weight="600" fill="#ffffff">People + color management + quality control</text>
</svg>
